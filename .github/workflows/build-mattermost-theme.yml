name: Build and Publish Mattermost Theme

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"
                  cache-dependency-path: "mattermost-theme/pnpm-lock.yaml"

            - name: Install dependencies
              working-directory: mattermost-theme
              run: pnpm install --frozen-lockfile

            - name: Build Keycloak theme
              working-directory: mattermost-theme
              run: pnpm run build-keycloak-theme

            - name: Rename JAR to mattermost-keycloak-theme-from-shadcn.jar
              run: |
                  cp mattermost-theme/dist_keycloak/keycloak-theme-for-kc-22-to-25.jar \
                     mattermost-keycloak-theme-from-shadcn.jar

            - name: Upload JAR Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: mattermost-keycloak-theme-from-shadcn
                  path: mattermost-keycloak-theme-from-shadcn.jar

            - name: Publish to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: "latest"
                  name: "latest (${{ github.sha }})"
                  body: |
                      Automated build of the `rfyuz_mattermost-keycloak-login-theme` Keycloak theme for Keycloak 22 to 25.
                      Commit: ${{ github.sha }}
                  files: mattermost-keycloak-theme-from-shadcn.jar
                  make_latest: true
